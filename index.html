<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aalam 16эт — Aalam 16-кабат</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 14px 36px rgba(15, 23, 42, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      line-height: 1.45;
      min-height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 92px;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
      background: var(--success-soft);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .sync-badge.offline {
      color: var(--warning);
      background: var(--warning-soft);
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .lang-switch {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .role-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      white-space: nowrap;
    }

    .role-btn.authed {
      background: var(--primary-soft);
      border-color: #bfdbfe;
      color: var(--primary);
    }

    /* Entrance Picker Button */
    .entrance-picker-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      text-align: left;
      min-height: 50px;
    }

    .entrance-picker-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .entrance-picker-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .entrance-picker-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .entrance-picker-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Content */
    .content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px;
      gap: 2px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      min-height: 34px;
    }

    .seg-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .sort-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 12px;
      cursor: pointer;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* List / Cards */
    .floor-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .floor-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: transform 0.12s ease, border-color 0.12s ease;
      min-height: 62px;
    }

    .floor-card:active {
      transform: scale(0.99);
    }

    .floor-card.house-card {
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
      border-color: #bfdbfe;
      padding: 15px 14px;
    }

    .floor-main {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .floor-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .floor-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-open {
      background: var(--warning-soft);
      color: #b45309;
    }

    .badge-check {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge-done {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge-empty {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    /* Task View */
    .back-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 12px;
      cursor: pointer;
      min-height: 40px;
    }

    .section-heading {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .zone-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .zone-chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 34px;
    }

    .zone-chip.active {
      background: var(--text);
      color: #ffffff;
      border-color: var(--text);
    }

    .task-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .zone-tag {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .task-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0;
      color: var(--text);
    }

    .task-desc {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      white-space: pre-line;
    }

    .task-photo {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface-2);
    }

    .checks-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 4px;
    }

    .check-btn {
      border: 1.5px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 10px;
      min-height: 46px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .check-btn.done-1 {
      background: var(--primary-soft);
      border-color: #93c5fd;
      color: var(--primary);
    }

    .check-btn.done-2 {
      background: var(--success-soft);
      border-color: #86efac;
      color: var(--success);
    }

    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .del-btn {
      border: 1px solid #fecaca;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      min-height: 34px;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* FAB */
    .fab-wrap {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px 14px 18px;
      background: linear-gradient(to top, var(--bg) 75%, rgba(244, 246, 249, 0));
      z-index: 19;
      pointer-events: none;
    }

    .fab-btn {
      pointer-events: auto;
      width: 100%;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      padding: 14px 18px;
      border-radius: 16px;
      min-height: 50px;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .fab-btn:active {
      background: var(--primary-hover);
      transform: scale(0.99);
    }

    /* Modals & Sheets */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.52);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .backdrop.open {
      display: flex;
    }

    .backdrop.center {
      align-items: center;
      padding: 16px;
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      padding: 14px 16px 26px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow-lg);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #cbd5e1;
      margin: 0 auto 12px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .close-btn {
      border: none;
      background: var(--surface-2);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .option-card {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .option-card.active {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input, .select, .textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
    }

    .textarea {
      min-height: 76px;
      resize: vertical;
    }

    .pin-input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 10px;
      text-align: center;
      margin-bottom: 12px;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      padding: 13px 16px;
      border-radius: 12px;
      min-height: 46px;
      cursor: pointer;
    }

    .preview-thumb {
      width: 100%;
      max-height: 190px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 8px;
      border: 1px solid var(--line);
      display: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 86vh;
      border-radius: 12px;
    }

    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #0f172a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 90;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-title" id="brandTitle">Aalam 16эт</div>
          <div class="sync-badge" id="syncBadge">
            <span class="sync-dot"></span>
            <span id="syncText">Онлайн</span>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn active" data-lang="ru" onclick="setLang('ru')">RU</button>
            <button type="button" class="lang-btn" data-lang="kg" onclick="setLang('kg')">KG</button>
          </div>
          <button type="button" class="role-btn" id="roleBtn" onclick="openAuthModal()">
            <span>🔑</span>
            <span id="roleBtnText">Войти</span>
          </button>
        </div>
      </div>

      <button type="button" class="entrance-picker-btn" onclick="openEntranceSheet()">
        <div class="entrance-picker-left">
          <span class="entrance-picker-label" id="entranceLabel">Выбранный подъезд</span>
          <span class="entrance-picker-value" id="currentEntranceName">Подъезд №1</span>
        </div>
        <div class="entrance-picker-right">
          <span id="entranceSummaryPill"></span>
          <span>▾</span>
        </div>
      </button>
    </header>

    <main class="content" id="mainView"></main>

    <div class="fab-wrap">
      <button type="button" class="fab-btn" onclick="openCreateModal()">
        <span>＋</span>
        <span id="fabText">Добавить задание</span>
      </button>
    </div>
  </div>

  <!-- Entrance Picker Bottom Sheet -->
  <div class="backdrop" id="entranceSheet" onclick="backdropClose(event, 'entranceSheet')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="entranceSheetTitle">Выберите подъезд</h3>
        <button type="button" class="close-btn" onclick="closeModal('entranceSheet')">✕</button>
      </div>
      <div id="entranceOptions"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="backdrop center" id="authModal" onclick="backdropClose(event, 'authModal')">
    <div class="modal-card">
      <div class="sheet-header">
        <h3 class="sheet-title" id="authTitle">Вход для домкома / модератора</h3>
        <button type="button" class="close-btn" onclick="closeModal('authModal')">✕</button>
      </div>
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px;" id="authDesc">
        Введите PIN-код для приёмки работ (2-я галочка) и удаления задач.
      </p>
      <div id="activeRoleBanner" style="display:none;background:var(--primary-soft);border:1px solid #bfdbfe;border-radius:12px;padding:10px 12px;margin-bottom:12px;align-items:center;justify-content:space-between;gap:8px;">
        <span id="activeRoleLabel" style="font-size:13px;font-weight:800;color:var(--primary);"></span>
        <button type="button" onclick="logoutRole()" style="border:none;background:#ffffff;color:var(--danger);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;" id="logoutBtnText">Выйти</button>
      </div>
      <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pinInput" placeholder="••••" />
      <div class="error-msg" id="pinError"></div>
      <button type="button" class="primary-btn" id="pinSubmitBtn" onclick="submitPin()">Подтвердить PIN</button>
    </div>
  </div>

  <!-- Create Task Modal -->
  <div class="backdrop" id="createModal" onclick="backdropClose(event, 'createModal')">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="sheet-title" id="createTitle">Новое задание</h3>
        <button type="button" class="close-btn" onclick="closeModal('createModal')">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label" id="lblTaskEntrance" for="taskEntrance">Подъезд</label>
        <select class="select" id="taskEntrance"></select>
      </div>

      <div class="form-group">
        <label class="form-label" id="lblTaskLocation" for="taskLocation">Раздел / Этаж</label>
        <select class="select" id="taskLocation" onchange="toggleZoneSelect()"></select>
      </div>

      <div class="form-group" id="zoneFormGroup" style="display:none;">
        <label class="form-label" id="lblTaskZone" for="taskZone">Общедомовая зона</label>
        <select class="select" id="taskZone"></select>
      </div>

      <div class="form-group">
        <label class="form-label" id="lblTaskTitle" for="taskTitle">Что нужно сделать?</label>
        <input type="text" class="input" id="taskTitle" />

    let state = {
      lang: localStorage.getItem(STORAGE_KEY_LANG) || 'ru',
      entrance: 1,
      selectedLocation: null,

      zoneFilter: 'all',

      tasks: [],
      draftPhoto: null,

    function loadRoleAndCache() {
      try {
        const savedRole = localStorage.getItem(STORAGE_KEY_ROLE);
        if (savedRole) state.role = JSON.parse(savedRole);
      } catch (e) {
        state.role = null;
      }

      try {
        const cached = localStorage.getItem(STORAGE_KEY_TASKS_CACHE);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed)) state.tasks = parsed;
        }
      } catch (e) {}
    }

    function saveCache() {
      try {
        localStorage.setItem(STORAGE_KEY_TASKS_CACHE, JSON.stringify(state.tasks));
      } catch (e) {}
    }

    async function fbRequest(path, method = 'GET', body = null) {
      const url = `${DB_URL}${path}.json`;
      const opts = { method, headers: {} };
      if (body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error('Firebase HTTP ' + res.status);
      return await res.json();
    }

    async function migrateLocalTasksIfNeeded() {
      if (localStorage.getItem(STORAGE_KEY_MIGRATED) === '1') return;
      try {
        const rawLocal = localStorage.getItem('aalam16_tasks_v1');
        if (!rawLocal) {
          localStorage.setItem(STORAGE_KEY_MIGRATED, '1');
          return;
        }
        const localArr = JSON.parse(rawLocal);
        if (!Array.isArray(localArr)) {
          localStorage.setItem(STORAGE_KEY_MIGRATED, '1');
          return;
        }

        const userTasks = localArr.filter(item => item && item.id && !DEMO_IDS.has(item.id));
        if (userTasks.length > 0) {
          const existingCloud = await fbRequest('/tasks');
          const cloudMap = existingCloud && typeof existingCloud === 'object' ? existingCloud : {};
          let moved = 0;
          for (const task of userTasks) {
            if (!cloudMap[task.id]) {
              await fbRequest(`/tasks/${task.id}`, 'PUT', task);
              moved++;
            }
          }
          if (moved > 0) {
            showToast(t().migratedToast(moved));
          }
        }
        localStorage.setItem(STORAGE_KEY_MIGRATED, '1');
      } catch (e) {
        // Если сети нет, попробуем при следующем запуске
      }
    }

    async function fetchTasksFromCloud() {
      try {
        const data = await fbRequest('/tasks');
        state.online = true;
        if (!data || typeof data !== 'object') {
          state.tasks = [];
        } else {
          const list = Object.values(data).filter(Boolean);
          list.sort((a, b) => String(b.id || '').localeCompare(String(a.id || '')));
          state.tasks = list;
        }
        saveCache();
        renderAll();
      } catch (e) {
        state.online = false;
        renderHeader();
      }
    }

    function startRealtimeStream() {
      try {
        const es = new EventSource(`${DB_URL}/tasks.json`);
        es.addEventListener('put', () => {
          fetchTasksFromCloud();
        });
        es.addEventListener('patch', () => {
          fetchTasksFromCloud();
        });
        es.onerror = () => {
          state.online = false;
          renderHeader();
        };
        es.onopen = () => {
          state.online = true;
          renderHeader();
        };
      } catch (e) {}

      setInterval(fetchTasksFromCloud, 8000);
    }

    function t() {
      return I18N[state.lang] || I18N.ru;
    }

    function getLocalizedText(val) {
      if (!val) return '';
      if (typeof val === 'string') return val;
      return val[state.lang] || val.ru || val.kg || '';
    }

    function getTaskStatus(task) {
      if (task.domkomDone) return 'done';
      if (task.workerDone) return 'check';
      return 'open';
    }

    function setLang(lang) {
      state.lang = lang;
      localStorage.setItem(STORAGE_KEY_LANG, lang);
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      renderAll();
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function backdropClose(e, id) {
      if (e.target.id === id) closeModal(id);
    }

    function openLightbox(src) {
      if (!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function getEntranceStats(entranceNum) {
      const list = state.tasks.filter(item => Number(item.entrance) === Number(entranceNum));
      let open = 0, check = 0, done = 0;
      list.forEach(item => {
        const st = getTaskStatus(item);
        if (st === 'open') open++;
        else if (st === 'check') check++;
        else done++;
      });
      return { total: list.length, open, check, done };
    }

    function getLocationStats(entranceNum, location) {
      const list = state.tasks.filter(
        item => Number(item.entrance) === Number(entranceNum) && String(item.location) === String(location)
      );
      let open = 0, check = 0, done = 0;
      list.forEach(item => {
        const st = getTaskStatus(item);
        if (st === 'open') open++;
        else if (st === 'check') check++;
        else done++;
      });
      return { total: list.length, open, check, done };
    }

    function renderHeader() {
      const tr = t();
      document.title = tr.brand;
      document.getElementById('brandTitle').textContent = tr.brand;

      const syncBadge = document.getElementById('syncBadge');
      syncBadge.classList.toggle('offline', !state.online);
      document.getElementById('syncText').textContent = state.online ? tr.online : tr.offline;

      document.getElementById('entranceLabel').textContent = tr.entranceLabel;
      document.getElementById('currentEntranceName').textContent = tr.entranceName(state.entrance);
      document.getElementById('fabText').textContent = tr.addTask;

      const est = getEntranceStats(state.entrance);
      const activeTotal = est.open + est.check;
      document.getElementById('entranceSummaryPill').textContent =
        activeTotal > 0 ? `${tr.filterOpen}: ${activeTotal}` : `${tr.filterDone}: ${est.done}`;

      const roleBtn = document.getElementById('roleBtn');
      const roleBtnText = document.getElementById('roleBtnText');
      if (state.role) {
        roleBtn.classList.add('authed');
        roleBtnText.textContent = state.role.role === 'moderator'
          ? tr.roleMod
          : tr.roleDomkom(state.role.entrance);
      } else {
        roleBtn.classList.remove('authed');
        roleBtnText.textContent = tr.login;
      }
    }

    function renderBadges(stats) {
      const tr = t();
      if (stats.total === 0) {
        return `<span class="badge badge-empty">${tr.noTasks}</span>`;
      }
      const parts = [];
      if (stats.open > 0) parts.push(`<span class="badge badge-open">${tr.openCount(stats.open)}</span>`);
      if (stats.check > 0) parts.push(`<span class="badge badge-check">${tr.checkCount(stats.check)}</span>`);
      if (stats.done > 0) parts.push(`<span class="badge badge-done">${tr.doneCount(stats.done)}</span>`);
      return parts.join('');
    }

    function renderAll() {
      renderHeader();
      if (state.selectedLocation === null) {
        renderFloorsScreen();
      } else {
        renderTasksScreen();
      }
    }

    function renderFloorsScreen() {
      const tr = t();
      const main = document.getElementById('mainView');

      const filters = [
        { key: 'all', label: tr.filterAll },
        { key: 'open', label: tr.filterOpen },
        { key: 'check', label: tr.filterCheck },
        { key: 'done', label: tr.filterDone }
      ];

      const controlsHtml = `
        <div class="controls-row">
          <div class="seg-group">
            ${filters.map(f => `
              <button type="button" class="seg-btn ${state.statusFilter === f.key ? 'active' : ''}" onclick="setStatusFilter('${f.key}')">
                ${f.label}
              </button>
            `).join('')}
          </div>
          <button type="button" class="sort-btn" onclick="toggleSort()">
            ${state.sortAsc ? tr.sortAsc : tr.sortDesc}
          </button>
        </div>
      `;

      const houseStats = getLocationStats(state.entrance, 'house');
      const houseHtml = `
        <div class="floor-card house-card" onclick="selectLocation('house')">
          <div class="floor-main">
            <div class="floor-title">🏠 ${tr.houseTitle}</div>
            <div class="floor-sub">${tr.houseSub}</div>
          </div>
          <div class="badges">${renderBadges(houseStats)}</div>
        </div>
      `;

      const floors = [];
      for (let f = 1; f <= 16; f++) floors.push(f);
      if (!state.sortAsc) floors.reverse();

      const floorsHtml = floors.map(floorNum => {
        const fStats = getLocationStats(state.entrance, floorNum);
        return `
          <div class="floor-card" onclick="selectLocation(${floorNum})">
            <div class="floor-main">
              <div class="floor-title">${tr.floorTitle(floorNum)}</div>
            </div>
            <div class="badges">${renderBadges(fStats)}</div>
          </div>
        `;
      }).join('');

      main.innerHTML = `
        ${controlsHtml}
        <div class="floor-list">
          ${houseHtml}
          ${floorsHtml}
        </div>
      `;
    }

    function renderTasksScreen() {
      const tr = t();
      const main = document.getElementById('mainView');
      const isHouse = state.selectedLocation === 'house';
      const headingText = isHouse
        ? `${tr.entranceShort(state.entrance)} • ${tr.houseTitle}`
        : `${tr.entranceShort(state.entrance)} • ${tr.floorTitle(state.selectedLocation)}`;

      let zoneBarHtml = '';
      if (isHouse) {
        const zoneKeys = ['all', ...ZONES];
        zoneBarHtml = `
          <div class="zone-chips">
            ${zoneKeys.map(zk => `
              <button type="button" class="zone-chip ${state.zoneFilter === zk ? 'active' : ''}" onclick="setZoneFilter('${zk}')">
                ${tr.zones[zk]}
              </button>
            `).join('')}
          </div>
        `;
      }

      const statusFilters = [
        { key: 'all', label: tr.filterAll },
        { key: 'open', label: tr.filterOpen },
        { key: 'check', label: tr.filterCheck },
        { key: 'done', label: tr.filterDone }
      ];

      const filterBarHtml = `
        <div class="controls-row">
          <div class="seg-group">
            ${statusFilters.map(f => `
              <button type="button" class="seg-btn ${state.statusFilter === f.key ? 'active' : ''}" onclick="setStatusFilter('${f.key}')">
                ${f.label}
              </button>
            `).join('')}
          </div>
        </div>
      `;

      const filteredTasks = state.tasks.filter(item => {
        if (Number(item.entrance) !== Number(state.entrance)) return false;
        if (String(item.location) !== String(state.selectedLocation)) return false;
        if (isHouse && state.zoneFilter !== 'all' && item.zone !== state.zoneFilter) return false;
        const st = getTaskStatus(item);
        if (state.statusFilter !== 'all' && st !== state.statusFilter) return false;
        return true;
      });

      let cardsHtml = '';
      if (filteredTasks.length === 0) {
        cardsHtml = `<div class="empty-state">${tr.emptyTasks}</div>`;
      } else {
        cardsHtml = filteredTasks.map(task => {
          const titleText = getLocalizedText(task.title);
          const descText = getLocalizedText(task.desc);
          const zoneBadge = isHouse && task.zone && tr.zones[task.zone]
            ? `<span class="zone-tag">${tr.zones[task.zone]}</span>`
            : '';

          const canManage = canManageEntrance(task.entrance);

          return `
            <article class="task-card">
              <div class="task-top">
                <div class="task-meta">
                  ${zoneBadge}
                  <span>${tr.createdAtLabel}: ${formatTaskDateTime(task)}</span>
                </div>
                ${canManage ? `
                  <button type="button" class="del-btn" onclick="deleteTask('${task.id}')">${tr.deleteBtn}</button>
                ` : ''}
              </div>
              <h4 class="task-title">${escapeHtml(titleText)}</h4>
              ${descText ? `<p class="task-desc">${escapeHtml(descText)}</p>` : ''}
              ${task.photo ? `<img class="task-photo" src="${task.photo}" alt="" onclick="openLightbox('${task.photo}')" />` : ''}
              <div class="checks-box">
                <button type="button" class="check-btn ${task.workerDone ? 'done-1' : ''}" onclick="toggleWorkerCheck('${task.id}')">
                  ${task.workerDone ? tr.check1Done : tr.check1}
                </button>
                <button type="button" class="check-btn ${task.domkomDone ? 'done-2' : ''}" onclick="toggleDomkomCheck('${task.id}')">
                  ${task.domkomDone ? tr.check2Done : tr.check2}
                </button>
              </div>
              <div class="task-footer">
                <span>${tr.entranceName(task.entrance)}</span>
                <span>${isHouse ? tr.houseTitle : tr.floorTitle(task.location)}</span>
              </div>
            </article>
          `;
        }).join('');
      }

      main.innerHTML = `
        <div class="back-bar">
          <button type="button" class="back-btn" onclick="selectLocation(null)">← ${tr.backToFloors}</button>
          <h2 class="section-heading">${headingText}</h2>
        </div>
        ${zoneBarHtml}
        ${filterBarHtml}
        <div class="floor-list">${cardsHtml}</div>
      `;
    }

    function formatTaskDateTime(task) {
      if (task.createdAt && task.createdAt.includes('.')) {
        return task.createdAt;
      }
      const match = String(task.id || '').match(/^t-(\d{13})/);
      if (match) {
        const d = new Date(Number(match[1]));
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const hours = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return `${day}.${month} ${hours}:${mins}`;
      }
      return task.createdAt || '';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function selectLocation(loc) {
      state.selectedLocation = loc;
      state.zoneFilter = 'all';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setStatusFilter(f) {
      state.statusFilter = f;
      renderAll();
    }

    function setZoneFilter(z) {
      state.zoneFilter = z;
      renderTasksScreen();
    }

    function toggleSort() {
      state.sortAsc = !state.sortAsc;
      renderFloorsScreen();
    }

    function openEntranceSheet() {
      const tr = t();
      document.getElementById('entranceSheetTitle').textContent = tr.selectEntrance;
      const container = document.getElementById('entranceOptions');
      container.innerHTML = [1, 2, 3].map(num => {
        const st = getEntranceStats(num);
        const active = Number(state.entrance) === Number(num);
        return `
          <button type="button" class="option-card ${active ? 'active' : ''}" onclick="chooseEntrance(${num})">
            <div>
              <div style="font-size:15px;font-weight:800;">${tr.entranceName(num)}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">
                ${tr.filterOpen}: ${st.open} • ${tr.filterCheck}: ${st.check} • ${tr.filterDone}: ${st.done}
              </div>
            </div>
            <div style="font-size:16px;font-weight:800;color:var(--primary);">${active ? '✓' : '›'}</div>
          </button>
        `;
      }).join('');
      openModal('entranceSheet');
    }

    function chooseEntrance(num) {
      state.entrance = num;
      state.selectedLocation = null;
      state.zoneFilter = 'all';
      closeModal('entranceSheet');
      renderAll();
    }

    function canManageEntrance(entranceNum) {
      if (!state.role) return false;
      if (state.role.role === 'moderator') return true;
      if (state.role.role === 'domkom' && Number(state.role.entrance) === Number(entranceNum)) return true;
      return false;
    }

    function openAuthModal() {
      const tr = t();
      document.getElementById('authTitle').textContent = tr.authTitle;
      document.getElementById('authDesc').textContent = tr.authDesc;
      document.getElementById('pinInput').placeholder = tr.pinPlaceholder;
      document.getElementById('pinSubmitBtn').textContent = tr.pinSubmit;
      document.getElementById('logoutBtnText').textContent = tr.logout;
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').textContent = '';

      const banner = document.getElementById('activeRoleBanner');
      if (state.role) {
        banner.style.display = 'flex';
        document.getElementById('activeRoleLabel').textContent =
          state.role.role === 'moderator' ? tr.roleMod : tr.roleDomkom(state.role.entrance);
      } else {
        banner.style.display = 'none';
      }

      openModal('authModal');
      setTimeout(() => document.getElementById('pinInput').focus(), 80);
    }

    function submitPin() {
      const tr = t();
      const code = document.getElementById('pinInput').value.trim();
      const matched = ACCESS_PINS[code];
      if (!matched) {
        document.getElementById('pinError').textContent = tr.pinInvalid;
        return;
      }
      state.role = { ...matched };
      localStorage.setItem(STORAGE_KEY_ROLE, JSON.stringify(state.role));
      closeModal('authModal');
      renderAll();
      showToast(state.role.role === 'moderator' ? tr.roleMod : tr.roleDomkom(state.role.entrance));
    }

    function logoutRole() {
      state.role = null;
      localStorage.removeItem(STORAGE_KEY_ROLE);
      closeModal('authModal');
      renderAll();
    }

    async function toggleWorkerCheck(taskId) {
      const task = state.tasks.find(item => item.id === taskId);
      if (!task) return;
      if (task.workerDone) {
        task.workerDone = false;
        task.domkomDone = false;
      } else {
        task.workerDone = true;
      }
      saveCache();
      renderAll();
      try {
        await fbRequest(`/tasks/${task.id}`, 'PATCH', {
          workerDone: task.workerDone,
          domkomDone: task.domkomDone
        });
      } catch (e) {}
    }

    async function toggleDomkomCheck(taskId) {
      const tr = t();
      const task = state.tasks.find(item => item.id === taskId);
      if (!task) return;

      if (!state.role) {
        showToast(tr.needAuthCheck2);
        openAuthModal();
        return;
      }

      if (!canManageEntrance(task.entrance)) {
        showToast(tr.wrongEntrance(task.entrance));
        return;
      }

      if (!task.domkomDone) {
        task.workerDone = true;
        task.domkomDone = true;
      } else {
        task.domkomDone = false;
      }

      saveCache();
      renderAll();
      try {
        await fbRequest(`/tasks/${task.id}`, 'PATCH', {
          workerDone: task.workerDone,
          domkomDone: task.domkomDone
        });
      } catch (e) {}
    }

    async function deleteTask(taskId) {
      const tr = t();
      const task = state.tasks.find(item => item.id === taskId);
      if (!task) return;
      if (!canManageEntrance(task.entrance)) {
        showToast(tr.wrongEntrance(task.entrance));
        return;
      }
      if (!confirm(tr.confirmDelete)) return;

      state.tasks = state.tasks.filter(item => item.id !== taskId);
      saveCache();
      renderAll();
      showToast(tr.deletedToast);

      try {
        await fbRequest(`/tasks/${taskId}`, 'DELETE');
      } catch (e) {}
    }

    function openCreateModal() {
      const tr = t();
      state.draftPhoto = null;

      document.getElementById('createTitle').textContent = tr.createTitle;
      document.getElementById('lblTaskEntrance').textContent = tr.lblEntrance;
      document.getElementById('lblTaskLocation').textContent = tr.lblLocation;
      document.getElementById('lblTaskZone').textContent = tr.lblZone;
      document.getElementById('lblTaskTitle').textContent = tr.lblTitle;
      document.getElementById('taskTitle').placeholder = tr.titlePlaceholder;
      document.getElementById('taskTitle').value = '';
      document.getElementById('lblTaskDesc').textContent = tr.lblDesc;
      document.getElementById('taskDesc').placeholder = tr.descPlaceholder;
      document.getElementById('taskDesc').value = '';
      document.getElementById('lblTaskPhoto').textContent = tr.lblPhoto;
      document.getElementById('taskPhoto').value = '';
      document.getElementById('createError').textContent = '';
      document.getElementById('createSubmitBtn').textContent = tr.createSubmit;

      const preview = document.getElementById('photoPreview');
      preview.src = '';
      preview.style.display = 'none';

      const entSelect = document.getElementById('taskEntrance');
      entSelect.innerHTML = [1, 2, 3].map(n =>
        `<option value="${n}" ${Number(n) === Number(state.entrance) ? 'selected' : ''}>${tr.entranceName(n)}</option>`
      ).join('');

      const locSelect = document.getElementById('taskLocation');
      let locOptions = `<option value="house">🏠 ${tr.houseTitle} (${tr.houseSub})</option>`;
      for (let f = 1; f <= 16; f++) {
        locOptions += `<option value="${f}">${tr.floorTitle(f)}</option>`;
      }
      locSelect.innerHTML = locOptions;

      if (state.selectedLocation !== null) {
        locSelect.value = String(state.selectedLocation);
      } else {
        locSelect.value = 'house';
      }

      const zoneSelect = document.getElementById('taskZone');
      zoneSelect.innerHTML = ZONES.map(zk =>
        `<option value="${zk}">${tr.zones[zk]}</option>`
      ).join('');

      toggleZoneSelect();
      openModal('createModal');
    }

    function toggleZoneSelect() {
      const locVal = document.getElementById('taskLocation').value;
      document.getElementById('zoneFormGroup').style.display = locVal === 'house' ? 'block' : 'none';
    }

    function handlePhotoChange(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        state.draftPhoto = null;
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxW = 800;
          const scale = img.width > maxW ? maxW / img.width : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressed = canvas.toDataURL('image/jpeg', 0.68);
          state.draftPhoto = compressed;

          const preview = document.getElementById('photoPreview');
          preview.src = compressed;
          preview.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function createTask() {
      const tr = t();
      const titleVal = document.getElementById('taskTitle').value.trim();
      if (!titleVal) {
        document.getElementById('createError').textContent = tr.errTitle;
        return;
      }

      const entranceNum = Number(document.getElementById('taskEntrance').value);
      const rawLoc = document.getElementById('taskLocation').value;
      const locationVal = rawLoc === 'house' ? 'house' : Number(rawLoc);
      const zoneVal = locationVal === 'house' ? document.getElementById('taskZone').value : null;
      const descVal = document.getElementById('taskDesc').value.trim();

      const now = new Date();
      const timeStr = `${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newTask = {
        id: 't-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        entrance: entranceNum,
        location: locationVal,
        zone: zoneVal,
        title: titleVal,
        desc: descVal,
        photo: state.draftPhoto || null,
        workerDone: false,
        domkomDone: false,
        createdAt: timeStr
      };

      state.tasks.unshift(newTask);
      saveCache();
      state.entrance = entranceNum;
      state.selectedLocation = locationVal;
      state.statusFilter = 'all';
      state.zoneFilter = 'all';

      closeModal('createModal');
      renderAll();
      showToast(tr.taskCreated);

      try {
        await fbRequest(`/tasks/${newTask.id}`, 'PUT', newTask);
        state.online = true;
        renderHeader();
      } catch (e) {
        state.online = false;
        renderHeader();
      }
    }

    loadRoleAndCache();
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === state.lang);
    });
    renderAll();

    (async () => {
      await migrateLocalTasksIfNeeded();
      await fetchTasksFromCloud();
      startRealtimeStream();
    })();
  </script>
</body>
</html>
